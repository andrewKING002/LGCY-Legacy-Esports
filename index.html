<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09050f">
  <title>LGCY • Legacy Esports</title>
  <style>:root{
  --bg:#07050b;--panel:#100b18;--panel2:#160d22;--line:#5e1c92;--purple:#9b2cff;
  --purple2:#d77cff;--white:#f7f4fb;--muted:#a99fb3;--green:#7cff73;--gold:#ffd24a;
  --red:#ff5964;--shadow:0 20px 60px rgba(0,0,0,.45);
}
*{box-sizing:border-box} body{margin:0;background:
radial-gradient(circle at 80% 0%,rgba(132,0,255,.16),transparent 28%),
radial-gradient(circle at 10% 30%,rgba(91,0,170,.12),transparent 25%),var(--bg);
color:var(--white);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer}
.hidden{display:none!important}.muted{color:var(--muted)}.error{color:var(--red);min-height:22px;margin-top:10px}
.login-screen{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:min(430px,100%);padding:34px;border:1px solid var(--line);border-radius:24px;
background:linear-gradient(145deg,rgba(24,13,35,.96),rgba(7,5,11,.96));box-shadow:var(--shadow);text-align:center}
.login-logo{width:150px;height:110px;object-fit:contain;border-radius:16px;margin-bottom:8px}
.eyebrow{color:var(--purple2);letter-spacing:3px;font-weight:800;font-size:12px}
h1{font-size:36px;margin:10px 0 8px}.pin-input{width:100%;margin-top:22px;padding:17px;text-align:center;letter-spacing:14px;
font-size:25px;background:#08060b;border:1px solid #5d2a78;color:white;border-radius:13px;outline:none}
.pin-input:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(155,44,255,.12)}
.primary-btn,.secondary-btn,.danger-btn{border:0;border-radius:11px;padding:12px 16px;font-weight:800;color:white}
.primary-btn{background:linear-gradient(135deg,#8e20e9,#c450ff);box-shadow:0 8px 22px rgba(151,42,255,.22)}
.secondary-btn{background:#20152a;border:1px solid #5d2a78}.danger-btn{background:#43131b;border:1px solid #7e2630}
.full{width:100%;margin-top:14px}.security-note{font-size:11px;color:#73687b;margin-top:18px}
.topbar{position:sticky;top:0;z-index:10;height:76px;border-bottom:1px solid rgba(155,44,255,.25);
background:rgba(7,5,11,.9);backdrop-filter:blur(18px);display:flex;align-items:center;padding:0 22px;gap:20px}
.brand{display:flex;align-items:center;gap:10px;min-width:190px}.brand img{width:48px;height:48px;object-fit:cover;border-radius:10px}
.brand strong{display:block;letter-spacing:2px}.brand span{font-size:10px;color:var(--purple2);letter-spacing:2px}
nav{display:flex;gap:4px;flex:1;justify-content:center}.nav-btn{background:transparent;border:0;color:#bcb2c5;padding:10px 11px;border-radius:9px}
.nav-btn:hover,.nav-btn.active{background:#1a0e26;color:white}.nav-btn.active{box-shadow:inset 0 -2px 0 var(--purple)}
.top-user{display:flex;align-items:center;gap:9px;font-weight:700;font-size:13px}.icon-btn{background:#160d20;color:white;border:1px solid #4e2866;border-radius:9px;padding:8px 10px}
main{max-width:1450px;margin:auto;padding:28px 22px 60px}.page-head{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:22px}
.page-head h2{font-size:30px;margin:0 0 5px}.page-head p{margin:0;color:var(--muted)}
.grid{display:grid;gap:16px}.stats-grid{grid-template-columns:repeat(5,1fr)}.two-col{grid-template-columns:2fr 1fr}.four-col{grid-template-columns:repeat(4,1fr)}
.card{background:linear-gradient(145deg,rgba(20,12,28,.94),rgba(12,8,16,.94));border:1px solid rgba(125,45,165,.48);
border-radius:16px;padding:18px;box-shadow:0 12px 35px rgba(0,0,0,.22)}.stat-card .label{color:#9d92a7;font-size:11px;letter-spacing:1.5px;text-transform:uppercase}
.stat-card .value{font-size:30px;font-weight:900;margin-top:7px}.accent{color:var(--purple2)}
.hero{padding:26px;border:1px solid #6c2d95;border-radius:18px;background:
linear-gradient(120deg,rgba(104,13,159,.22),rgba(13,8,18,.95)),radial-gradient(circle at 90% 10%,rgba(174,61,255,.2),transparent 30%)}
.hero h2{margin:0;font-size:34px}.hero p{color:#b7aebe}.section-title{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}.section-title h3{margin:0}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:780px}.table th{text-align:left;color:#8e8396;font-size:11px;letter-spacing:1px;padding:11px 10px;border-bottom:1px solid #39223f}
.table td{padding:12px 10px;border-bottom:1px solid rgba(82,54,91,.25);font-size:14px}.table tr:hover td{background:rgba(155,44,255,.045)}
.rank{font-weight:900;color:var(--purple2)}.player-name{font-weight:800}.pill{display:inline-flex;padding:5px 8px;border-radius:99px;font-size:11px;background:#251330;border:1px solid #553066;color:#dfb8ff}
.kd-good{color:var(--green);font-weight:800}.kd-mid{color:#52c6ff;font-weight:800}.kd-low{color:var(--gold);font-weight:800}.kd-bad{color:var(--red);font-weight:800}
.player-grid{grid-template-columns:repeat(3,1fr)}.player-card{display:flex;align-items:center;gap:13px}.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
background:linear-gradient(135deg,#3a1450,#9b2cff);font-weight:900}.player-card h4{margin:0 0 4px}.player-card small{color:#9e94a7}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.form-grid.three{grid-template-columns:repeat(3,1fr)}label{display:block;color:#aaa0b0;font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:7px}
input,select{width:100%;background:#09070d;color:white;border:1px solid #4c2b59;border-radius:10px;padding:12px;outline:none}input:focus,select:focus{border-color:var(--purple)}
.team-box{border:1px solid #5d2a78;border-radius:15px;padding:15px;background:#0d0812}.team-box h4{margin:0 0 12px;color:var(--purple2)}
.team-row{display:grid;grid-template-columns:1.5fr .8fr .8fr .8fr .8fr;gap:8px;align-items:center;margin:7px 0}.team-row input{padding:9px}
.switch{display:flex;gap:8px;align-items:center}.switch input{width:auto}
.profile-head{display:flex;gap:20px;align-items:center}.big-avatar{width:88px;height:88px;border-radius:20px;display:grid;place-items:center;font-size:28px;font-weight:900;background:linear-gradient(135deg,#43105c,#b735ff)}
.score-big{font-size:50px;font-weight:950;color:var(--purple2)}.mini{font-size:12px;color:#978d9d}
.bar{height:8px;background:#211526;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#8f22e9,#d67cff);border-radius:99px}
.team-choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{padding:15px;border:1px solid #432550;border-radius:12px;background:#100a16}.choice.selected{border-color:var(--purple);box-shadow:0 0 0 2px rgba(155,44,255,.13)}
.toast{position:fixed;right:20px;bottom:20px;background:#180d21;border:1px solid #71339a;padding:13px 16px;border-radius:12px;z-index:100;color:white;box-shadow:var(--shadow)}
@media(max-width:1000px){.stats-grid{grid-template-columns:repeat(2,1fr)}.two-col,.player-grid,.four-col{grid-template-columns:1fr}.topbar{height:auto;flex-wrap:wrap;padding:12px}.brand{min-width:auto}.top-user{margin-left:auto}nav{order:3;width:100%;overflow:auto;justify-content:flex-start}.nav-btn{white-space:nowrap}.form-grid,.form-grid.three{grid-template-columns:1fr}}
@media(max-width:600px){main{padding:18px 12px 40px}.page-head{align-items:start;flex-direction:column}.stats-grid{grid-template-columns:1fr 1fr}.stat-card .value{font-size:24px}.hero h2{font-size:26px}.profile-head{align-items:flex-start}.top-user span{display:none}.team-row{grid-template-columns:1.2fr repeat(4,.65fr);font-size:11px}.team-row input{padding:7px 4px}.login-card{padding:25px}}

.profile-picker{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:18px;max-height:270px;overflow:auto;padding-right:2px}
.profile-choice{display:flex;align-items:center;gap:9px;text-align:left;background:#0b0710;border:1px solid #3c2449;color:#eee;border-radius:11px;padding:10px}
.profile-choice:hover,.profile-choice.selected{border-color:var(--purple);background:#1a0d25}
.profile-choice .avatar{width:34px;height:34px;min-width:34px;font-size:11px}
.profile-choice strong{font-size:12px;display:block}.profile-choice small{color:#8f8597;font-size:10px}
@media(max-width:600px){.profile-picker{grid-template-columns:1fr 1fr;max-height:240px}}

/* LGCY mobile-first polish */
@media(max-width:700px){
  body{font-size:14px;padding-bottom:70px}
  .topbar{position:sticky;top:0;height:auto;min-height:62px;padding:8px 12px;gap:8px}
  .brand{min-width:0;flex:1}.brand img{width:40px;height:40px}.brand strong{font-size:13px}.brand span{font-size:8px}
  .top-user{font-size:11px}
  nav{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:50;height:64px;padding:7px 4px;
    background:rgba(8,5,12,.97);border-top:1px solid #4b2363;backdrop-filter:blur(16px);
    display:grid;grid-template-columns:repeat(5,1fr);gap:2px;order:unset}
  .nav-btn{font-size:9px;padding:7px 2px;line-height:1.1;color:#a79bad}
  .nav-btn.active{color:#fff;background:#1b0d26;box-shadow:inset 0 2px 0 var(--purple)}
  #adminNav{display:none}
  #adminNav:not(.hidden){display:block}
  main{padding:15px 10px 25px;max-width:100%}
  .page-head{margin-bottom:14px;gap:10px}.page-head h2{font-size:24px}.page-head p{font-size:12px}
  .page-head .primary-btn,.page-head .secondary-btn{width:100%}
  .hero{padding:19px 16px;border-radius:15px}.hero h2{font-size:25px;line-height:1.1}.hero p{font-size:12px}
  .stats-grid{display:flex;overflow-x:auto;gap:9px;padding-bottom:3px;scroll-snap-type:x mandatory}
  .stats-grid .stat-card{min-width:145px;scroll-snap-align:start;padding:14px}.stat-card .value{font-size:23px}
  .grid.two-col,.grid.four-col,.player-grid{grid-template-columns:1fr}
  .card{padding:14px;border-radius:14px}
  .section-title{margin:14px 0 9px}.section-title h3{font-size:16px}
  .table-wrap{margin:0 -4px;padding:0 4px}
  .table{min-width:650px}.table th{font-size:9px;padding:9px 7px}.table td{font-size:12px;padding:10px 7px}
  .profile-head{gap:12px}.big-avatar{width:64px;height:64px;border-radius:15px;font-size:20px}
  .profile-head h2{font-size:22px}
  .score-big{font-size:38px}
  .form-grid,.form-grid.three{grid-template-columns:1fr}
  .team-choice{grid-template-columns:1fr}
  .team-box{padding:11px}
  .team-row{grid-template-columns:1.35fr .6fr .6fr .65fr .65fr;gap:4px}
  .team-row input,.team-row select{padding:9px 4px;font-size:11px;min-width:0}
  .primary-btn,.secondary-btn,.danger-btn{min-height:44px}
  input,select{min-height:44px}
  .login-screen{padding:14px}.login-card{padding:22px 15px;border-radius:20px}
  .login-logo{width:125px;height:92px}.login-card h1{font-size:29px}
  .profile-picker{max-height:300px;gap:7px}
  .profile-choice{min-height:52px;padding:8px}.profile-choice .avatar{width:30px;height:30px;min-width:30px}
  .pin-input{letter-spacing:10px}
  .toast{left:12px;right:12px;bottom:78px;text-align:center}
}
@media(max-width:390px){
  .brand span{display:none}.top-user span{display:none}
  .nav-btn{font-size:8px}.stats-grid .stat-card{min-width:132px}
}

:root{--black:#050407;--royal:#b73cff}
body{background:
radial-gradient(circle at 85% 0%,rgba(183,60,255,.18),transparent 30%),
radial-gradient(circle at 10% 25%,rgba(104,19,150,.12),transparent 27%),var(--black)}
.card{background:linear-gradient(145deg,rgba(22,13,29,.97),rgba(5,4,7,.97));border-color:rgba(183,60,255,.38)}
.hero{background:linear-gradient(120deg,rgba(83,16,118,.28),rgba(5,4,7,.96))}
@media(max-width:700px){
  body{padding-bottom:76px;background:var(--black)}
  nav{display:flex;overflow-x:auto;justify-content:flex-start;gap:3px;padding:7px 5px}
  .nav-btn{flex:0 0 78px}
  .nav-btn.active{box-shadow:inset 0 2px 0 var(--royal)}
  .page-head{position:sticky;top:62px;z-index:5;background:rgba(5,4,7,.93);backdrop-filter:blur(12px);padding:10px 0;margin-bottom:10px}
  .page-head h2{font-size:22px}
  .card{box-shadow:0 8px 25px rgba(0,0,0,.3)}
  .weekly-hero{padding:18px;border-radius:15px}
  .weekly-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .tap-card{min-height:88px;display:flex;flex-direction:column;justify-content:center}
}
</style>

function renderProfilePicker(){
 const picker=document.getElementById("profilePicker"); if(!picker)return;
 picker.innerHTML=db.players.filter(p=>p.active).map(p=>`
  <button class="profile-choice" data-id="${p.id}" onclick="selectProfile('${p.id}')">
   <span class="avatar">${initials(p.name)}</span>
   <span><strong>${esc(p.name)}</strong><small>${esc(p.role)}</small></span>
  </button>`).join("");
}
function selectProfile(id){
 const p=playerById(id); if(!p)return;
 state.selectedProfileId=id;
 document.querySelectorAll(".profile-choice").forEach(b=>b.classList.toggle("selected",b.dataset.id===id));
 document.getElementById("pinInput").focus();
 document.getElementById("loginError").textContent=`Selected: ${p.name}`;
}


function getWeekKey(date=new Date()){
 const d=new Date(date); d.setHours(0,0,0,0);
 const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day);
 return d.toISOString().slice(0,10);
}
function weekLabel(){
 const start=new Date(db.weekKey+"T00:00:00"); const end=new Date(start); end.setDate(end.getDate()+6);
 return start.toLocaleDateString(undefined,{day:"2-digit",month:"short"})+" – "+end.toLocaleDateString(undefined,{day:"2-digit",month:"short"});
}
function ensureWeeklyRollover(){
 const current=getWeekKey();
 if(!db.weekKey){db.weekKey=current;db.weekNumber=1}
 if(db.weekKey!==current){
   const snapshot={week:db.weekNumber||1,key:db.weekKey,players:db.players.filter(p=>p.active).map(p=>({
     id:p.id,name:p.name,points:p.weeklyPoints||0,games:p.weeklyGames||0,wins:p.weeklyWins||0,
     kills:p.weeklyKills||0,deaths:p.weeklyDeaths||0,mvp:p.weeklyMvp||0
   }))};
   db.weeklyHistory=db.weeklyHistory||[];
   db.weeklyHistory.unshift(snapshot);
   db.weeklyHistory=db.weeklyHistory.slice(0,12);
   db.players.forEach(p=>{p.weeklyPoints=0;p.weeklyGames=0;p.weeklyWins=0;p.weeklyKills=0;p.weeklyDeaths=0;p.weeklyMvp=0});
   db.weekKey=current; db.weekNumber=(db.weekNumber||1)+1; save();
 }
}
async function loadFromSupabase(){
  const { data, error } = await supabase
    .from("players")
    .select("*")
    .eq("active", true)
    .order("name");

  if(error){
    console.error("LGCY Supabase player load failed:", error);
    return null;
  }

  return data;
}
function load(){
 try{
  const raw=localStorage.getItem(STORAGE);
  if(raw){
   const d=JSON.parse(raw);
   const king=d.players?.find(p=>p.id==="king");
   if(king){ king.pin="2004"; king.leader=true; king.owner=true; king.role=king.role||"OWNER / FLEX"; king.team=king.team||"LGCY"; }
   d.weeklyHistory=d.weeklyHistory||[]; d.weekNumber=d.weekNumber||1; d.weekKey=d.weekKey||getWeekKey();
   d.players.forEach(p=>{p.weeklyPoints=p.weeklyPoints||0;p.weeklyGames=p.weeklyGames||0;p.weeklyWins=p.weeklyWins||0;p.weeklyKills=p.weeklyKills||0;p.weeklyDeaths=p.weeklyDeaths||0;p.weeklyMvp=p.weeklyMvp||0});
   return d;
  }
 }catch(e){}
 const d={players:seedPlayers,matches:[],pointsNights:[],weeklyHistory:[],season:"Season 1",weekKey:getWeekKey(),weekNumber:1,nextMatchId:1};
 localStorage.setItem(STORAGE,JSON.stringify(d)); return d;
}
function save(){localStorage.setItem(STORAGE,JSON.stringify(db))}
function playerById(id){return db.players.find(p=>p.id===id)}
function kd(p){return p.deaths? p.kills/p.deaths:0}
function winRate(p){
 const games=p.games||0, wins=p.wins||0; return games?wins/games*100:0
}
function initials(n){return n.split(" ").map(x=>x[0]).slice(0,2).join("").toUpperCase()}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function isLeader(){return !!state.user?.leader} function isOwner(){return !!state.user?.owner}
function toast(msg){const x=document.createElement("div");x.className="toast";x.textContent=msg;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}
function login(){
 const input=document.getElementById("pinInput");
 const pin=input.value.replace(/\D/g,"").slice(0,4);
 input.value=pin;
 const p=playerById(state.selectedProfileId);
 if(!p){document.getElementById("loginError").textContent="Select your profile first.";return}
 if(!p.active || String(p.pin)!==pin){document.getElementById("loginError").textContent="Incorrect PIN for this profile.";return}
 if(!p){document.getElementById("loginError").textContent="Invalid member PIN. Try KING's PIN: 2004.";return}
 state.user=p;
 document.getElementById("loginError").textContent="";
 document.getElementById("loginView").classList.add("hidden");
 document.getElementById("siteView").classList.remove("hidden");
 document.getElementById("currentUserName").textContent=p.name;
 document.getElementById("adminNav").classList.toggle("hidden",!p.leader);
 save();
 render();
}
function logout(){state.user=null;document.getElementById("siteView").classList.add("hidden");document.getElementById("loginView").classList.remove("hidden");document.getElementById("pinInput").value=""}
document.getElementById("pinInput").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
window.addEventListener("DOMContentLoaded",renderProfilePicker);
document.querySelectorAll(".nav-btn").forEach(b=>b.addEventListener("click",()=>{state.page=b.dataset.page;render()}));

function render(){
 document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.page===state.page));
 if(state.page==="admin"&&!isLeader()) state.page="dashboard";
 const content=document.getElementById("content");
 content.innerHTML=pages[state.page]();
 if(state.page==="dashboard")bindDashboard();
 if(state.page==="matches")bindMatches();
 if(state.page==="points")bindPoints();
 if(state.page==="profile")bindProfile();
 if(state.page==="admin")bindAdmin();
}
const pages={
 dashboard(){
  const ps=[...db.players].filter(p=>p.active).sort((a,b)=>kd(b)-kd(a));
  const totalKills=ps.reduce((a,p)=>a+p.kills,0), totalDeaths=ps.reduce((a,p)=>a+p.deaths,0);
  const totalGames=ps.reduce((a,p)=>a+p.games,0);
  const top=ps[0], bestScore=[...ps].sort((a,b)=>b.score-a.score)[0];
  return `<div class="hero"><div class="eyebrow">LGCY • ${db.season.toUpperCase()} • BLACK OPS 7 RANKED</div>
  <h2>One Legacy. Built to Compete.</h2><p>Private clan command centre for 4v4 multiplayer, player development and Points Nights.</p></div>
  <div class="grid stats-grid" style="margin-top:16px">
   ${stat("ACTIVE PLAYERS",ps.length,"Clan roster")}
   ${stat("MATCHES LOGGED",Math.max(0,Math.round(totalGames/4)),"Player-games ÷ 4")}
   ${stat("TOTAL KILLS",totalKills.toLocaleString(),"Across roster")}
   ${stat("OVERALL K/D",totalDeaths?(totalKills/totalDeaths).toFixed(2):"0.00","Clan average")}
   ${stat("TOP SCORE",bestScore?.score||0,bestScore?.name||"—")}
  </div>
  <div class="grid two-col" style="margin-top:18px">
   <div class="card"><div class="section-title"><h3>Top Players</h3><button class="secondary-btn" onclick="state.page='leaderboard';render()">Full leaderboard</button></div>
   <div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Player</th><th>Role</th><th>K/D</th><th>Score</th><th>Games</th></tr></thead><tbody>
   ${ps.slice(0,8).map((p,i)=>row(p,i+1)).join("")}</tbody></table></div></div>
   <div class="card"><div class="section-title"><h3>Clan Leaders</h3></div>${db.players.filter(p=>p.leader&&p.active).map(p=>`<div class="player-card" style="margin:12px 0"><div class="avatar">${initials(p.name)}</div><div><h4>${esc(p.name)}</h4><small>Website Leader • ${esc(p.role)}</small></div></div>`).join("")}
   <div class="section-title"><h3>Quick Actions</h3></div>${isLeader()?`<button class="primary-btn full" onclick="state.page='matches';render()">+ Add 4v4 Result</button>`:"<p class='muted'>Leaders can log match results from the Matches tab.</p>"}</div>
  </div>`
 },
 leaderboard(){
  const ps=[...db.players].filter(p=>p.active).sort((a,b)=>kd(b)-kd(a));
  return `<div class="page-head"><div><h2>Legacy Leaderboard</h2><p>Season 1 • Black Ops 7 • Ranked by K/D</p></div><button class="secondary-btn" onclick="state.page='profile';render()">My profile</button></div>
  <div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Rank</th><th>Player</th><th>Role</th><th>Team</th><th>Games</th><th>K/D</th><th>Kills</th><th>Deaths</th><th>Score</th><th>Points</th></tr></thead><tbody>
  ${ps.map((p,i)=>`<tr onclick="openPlayer('${p.id}')" style="cursor:pointer"><td class="rank">${i+1}</td><td class="player-name">${esc(p.name)}</td><td><span class="pill">${esc(p.role)}</span></td><td>${esc(p.team)}</td><td>${p.games}</td><td class="${kdClass(kd(p))}">${kd(p).toFixed(2)}</td><td>${p.kills}</td><td>${p.deaths}</td><td>${p.score}</td><td class="accent">${p.points||0}</td></tr>`).join("")}
  </tbody></table></div></div>
  <div class="grid four-col" style="margin-top:16px">${award("SLAYER","Highest K/D",ps[0]?.name||"—",ps[0]?kd(ps[0]).toFixed(2):"0.00")}${award("MVP","Highest Score",[...ps].sort((a,b)=>b.score-a.score)[0]?.name||"—",[...ps].sort((a,b)=>b.score-a.score)[0]?.score||0)}${award("OBJ KING","Most Objective",[...ps].sort((a,b)=>(b.obj||0)-(a.obj||0))[0]?.name||"—",[...ps].sort((a,b)=>(b.obj||0)-(a.obj||0))[0]?.obj||0)}${award("ATTENDANCE","Most Games",[...ps].sort((a,b)=>b.games-a.games)[0]?.name||"—",[...ps].sort((a,b)=>b.games-a.games)[0]?.games||0)}</div>`
 },

 weekly(){
  ensureWeeklyRollover();
  const ps=[...db.players].filter(p=>p.active).sort((a,b)=>(b.weeklyPoints||0)-(a.weeklyPoints||0));
  const leader=ps[0], games=ps.reduce((a,p)=>a+(p.weeklyGames||0),0);
  return `<div class="page-head"><div><h2>Weekly Leaderboard</h2><p>Week ${db.weekNumber} • ${weekLabel()} • resets every Monday</p></div></div>
  <div class="hero weekly-hero"><div class="eyebrow">LGCY • WEEK ${db.weekNumber}</div>
   <h2>${leader?`👑 ${esc(leader.name)} leads the week`:"No games yet"}</h2>
   <p>Weekly points reset each week, but the results are saved to the season history and contribute to each player's profile.</p>
  </div>
  <div class="weekly-grid" style="margin-top:12px">
   ${stat("WEEKLY #1",leader?.weeklyPoints||0,leader?.name||"—")}
   ${stat("GAMES",games, "Player games this week")}
   ${stat("TOP MVP",leader?.weeklyMvp||0,leader?.name||"—")}
   ${stat("WEEK",db.weekNumber,"Current week")}
  </div>
  <div class="card" style="margin-top:12px"><div class="section-title"><h3>This Week</h3><span class="pill">Live</span></div>
   <div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Player</th><th>Role</th><th>Points</th><th>W</th><th>K/D</th><th>MVP</th></tr></thead><tbody>
   ${ps.map((p,i)=>`<tr onclick="openPlayer('${p.id}')" style="cursor:pointer"><td class="rank">${i+1}</td><td class="player-name">${esc(p.name)}</td><td>${esc(p.role)}</td><td class="accent">${p.weeklyPoints||0}</td><td>${p.weeklyWins||0}</td><td class="${kdClass(p.weeklyDeaths?(p.weeklyKills/p.weeklyDeaths):0)}">${p.weeklyDeaths?(p.weeklyKills/p.weeklyDeaths).toFixed(2):"0.00"}</td><td>${p.weeklyMvp||0}</td></tr>`).join("")}
   </tbody></table></div>
  </div>
  <div class="card" style="margin-top:12px"><div class="section-title"><h3>Previous Weeks</h3></div>
   ${(db.weeklyHistory||[]).slice(0,5).map(h=>{const top=[...h.players].sort((a,b)=>b.points-a.points)[0];return `<div class="player-card" style="margin:10px 0"><div class="avatar">${h.week}</div><div><h4>Week ${h.week} • ${esc(top?.name||"—")}</h4><small>${top?.points||0} points • ${esc(h.key)}</small></div></div>`}).join("")||`<p class="muted">Completed weeks will appear here automatically.</p>`}
  </div>`
 },

 matches(){
  return `<div class="page-head"><div><h2>4v4 Match Centre</h2><p>Log both teams, result, MVP, K/D and objective performance.</p></div>${isLeader()?`<button class="primary-btn" onclick="showMatchForm()">+ Log 4v4 Match</button>`:""}</div>
  <div id="matchForm"></div>
  <div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Match</th><th>Date</th><th>Team A</th><th>Team B</th><th>Winner</th><th>MVP</th></tr></thead><tbody>
  ${db.matches.length?db.matches.slice().reverse().map(m=>`<tr><td>#${m.id}</td><td>${esc(m.date)}</td><td>${esc(m.teamAName)}</td><td>${esc(m.teamBName)}</td><td class="accent">${esc(m.winner)}</td><td>${esc(playerById(m.mvp)?.name||"—")}</td></tr>`).join(""):`<tr><td colspan="6" class="muted">No matches logged yet.</td></tr>`}
  </tbody></table></div></div>`
 },
 points(){
  const ps=[...db.players].filter(p=>p.active).sort((a,b)=>(b.points||0)-(a.points||0));
  return `<div class="page-head"><div><h2>Points Night</h2><p>Weekly competition • randomized 4v4 teams • seasonal points race.</p></div>${isLeader()?`<button class="primary-btn" onclick="randomizeTeams()">Randomize 4v4</button>`:""}</div>
  <div class="grid two-col"><div class="card"><div class="section-title"><h3>Season Points</h3><span class="pill">Season 1</span></div>
  <div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Player</th><th>Role</th><th>Points</th><th>Games</th></tr></thead><tbody>
  ${ps.map((p,i)=>`<tr><td class="rank">${i+1}</td><td class="player-name">${esc(p.name)}</td><td>${esc(p.role)}</td><td class="accent">${p.points||0}</td><td>${p.games}</td></tr>`).join("")}</tbody></table></div></div>
  <div class="card"><h3>Points System</h3><p class="muted">A starting framework you can change later.</p>
  <div class="mini" style="margin-top:16px">WIN</div><h3>+10 points</h3>
  <div class="mini">MVP</div><h3>+5 points</h3>
  <div class="mini">OBJ / CARRY PERFORMANCE</div><h3>+1 to +3 points</h3>
  <div class="mini">ATTENDANCE</div><h3>+2 points</h3></div></div>
  <div id="randomTeams" style="margin-top:16px"></div>`
 },
 profile(){
  const p=state.user;
  return profilePage(p,true)
 },
 admin(){
  return `<div class="page-head"><div><h2>Management</h2><p>Leaders only • manage the private LGCY roster and member access.</p></div></div>
  <div class="grid two-col"><div class="card"><h3>Roster</h3><div class="table-wrap"><table class="table"><thead><tr><th>Player</th><th>Role</th><th>PIN</th><th>Leader</th><th>Active</th><th></th></tr></thead><tbody>
  ${db.players.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.role)}</td><td><span class="pill">${esc(p.pin)}</span></td><td>${p.leader?"Yes":"No"}</td><td>${p.active?"Yes":"No"}</td><td><button class="secondary-btn" onclick="editPlayer('${p.id}')">Edit</button></td></tr>`).join("")}
  </tbody></table></div></div>
  <div class="card"><h3>Add member</h3><div id="adminForm"></div><button class="primary-btn full" onclick="addPlayer()">Create Member</button>
  <div class="section-title"><h3>Security note</h3></div><p class="muted">This downloadable prototype stores data in this browser. Before public deployment, move authentication and the database to a secure server so the PINs and clan data cannot be altered client-side.</p></div></div>`
 }
};

function stat(label,value,sub){return `<div class="card stat-card"><div class="label">${label}</div><div class="value">${value}</div><div class="mini">${sub}</div></div>`}
function row(p,i){return `<tr onclick="openPlayer('${p.id}')" style="cursor:pointer"><td class="rank">${i}</td><td class="player-name">${esc(p.name)}</td><td>${esc(p.role)}</td><td class="${kdClass(kd(p))}">${kd(p).toFixed(2)}</td><td>${p.score}</td><td>${p.games}</td></tr>`}
function kdClass(v){return v>=1.5?"kd-good":v>=1.1?"kd-mid":v>=.9?"kd-low":"kd-bad"}
function award(title,sub,name,val){return `<div class="card"><div class="eyebrow">${title}</div><div style="margin-top:12px;font-weight:800">${esc(name)}</div><div class="score-big" style="font-size:27px">${val}</div><div class="mini">${sub}</div></div>`}
function openPlayer(id){state.page="profile";state.viewPlayer=id;render()}
function profilePage(p,self){
 return `<div class="page-head"><div><h2>${esc(p.name)}'s Profile</h2><p>LGCY • ${esc(p.role)} • ${esc(p.team)}</p></div>${!self?`<button class="secondary-btn" onclick="state.page='leaderboard';render()">Back</button>`:""}</div>
 <div class="grid two-col"><div class="card"><div class="profile-head"><div class="big-avatar">${initials(p.name)}</div><div><div class="eyebrow">${esc(p.role)}</div><h2 style="margin:4px 0">${esc(p.name)}</h2><span class="pill">${esc(p.team)}</span></div></div>
 <div class="grid stats-grid" style="margin-top:20px">${stat("K/D",kd(p).toFixed(2),"Career")}${stat("KILLS",p.kills,"Total")}${stat("DEATHS",p.deaths,"Total")}${stat("GAMES",p.games,"Logged")}${stat("LEGACY SCORE",p.score,"Performance")}</div></div>
 <div class="card"><div class="eyebrow">CLAN POINTS</div><div class="score-big">${p.points||0}</div><p class="muted">Season 1 points</p><div class="section-title"><h3>Profile</h3></div><p><b>Role:</b> ${esc(p.role)}</p><p><b>Team:</b> ${esc(p.team)}</p><div class="section-title"><h3>This Week</h3><span class="pill">Week ${db.weekNumber}</span></div>
  <p><b>Weekly Points:</b> <span class="accent">${p.weeklyPoints||0}</span></p><p><b>Weekly Wins:</b> ${p.weeklyWins||0} • <b>Weekly MVP:</b> ${p.weeklyMvp||0}</p>
  ${self?`<button class="primary-btn full" onclick="editOwnProfile()">Customize Profile</button>`:""}</div></div>
 <div class="grid two-col" style="margin-top:16px"><div class="card"><h3>Performance</h3><p class="muted">Legacy Score is designed to grow from logged match performance.</p><div style="margin-top:18px"><div class="mini">K/D contribution</div><div class="bar"><i style="width:${Math.min(100,kd(p)/2*100)}%"></i></div></div><div style="margin-top:18px"><div class="mini">Activity</div><div class="bar"><i style="width:${Math.min(100,p.games/30*100)}%"></i></div></div></div><div class="card"><h3>Roles</h3><p class="muted">Choose your preferred competitive role: SMG, AR, FLEX, OBJ, ANCHOR or IGL.</p></div></div>`
}
function editOwnProfile(){
 const p=state.user;
 const role=prompt("Role (SMG, AR, FLEX, OBJ, ANCHOR, IGL):",p.role);
 if(!role)return; p.role=role.toUpperCase(); save(); toast("Profile updated");render();
}
function showMatchForm(){
 document.getElementById("matchForm").innerHTML=`<div class="card" style="margin-bottom:16px"><div class="section-title"><h3>Log 4v4 Result</h3><button class="secondary-btn" onclick="document.getElementById('matchForm').innerHTML=''">Close</button></div>
 <div class="form-grid"><div><label>Date</label><input id="mDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Winner</label><select id="mWinner"><option value="A">Team A</option><option value="B">Team B</option></select></div></div>
 <div class="team-choice" style="margin-top:16px"><div class="team-box"><h4>TEAM A</h4>${playerInputs("A")}</div><div class="team-box"><h4>TEAM B</h4>${playerInputs("B")}</div></div>
 <div class="form-grid" style="margin-top:15px"><div><label>MVP</label><select id="mMvp">${db.players.filter(p=>p.active).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select></div><div><label>Team names (optional)</label><input id="mTeamNames" placeholder="PRIME vs ALPHA"></div></div>
 <button class="primary-btn full" onclick="saveMatch()">Save Match & Update Stats</button></div>`;
}
function playerInputs(team){
 return [0,1,2,3].map(i=>`<div class="team-row"><select id="${team}p${i}">${db.players.filter(p=>p.active).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select><input id="${team}k${i}" type="number" min="0" placeholder="K"><input id="${team}d${i}" type="number" min="0" placeholder="D"><input id="${team}o${i}" type="number" min="0" placeholder="OBJ"><input id="${team}c${i}" type="number" min="0" placeholder="Carry"></div>`).join("")
}
function saveMatch(){
 const date=document.getElementById("mDate").value,winner=document.getElementById("mWinner").value;
 const ids=[],teams={A:[],B:[]};
 for(const t of ["A","B"]) for(let i=0;i<4;i++){
  const id=document.getElementById(`${t}p${i}`).value;
  if(ids.includes(id)){toast("A player cannot be entered twice.");return}
  ids.push(id); teams[t].push({id,k:+document.getElementById(`${t}k${i}`).value||0,d:+document.getElementById(`${t}d${i}`).value||0,o:+document.getElementById(`${t}o${i}`).value||0,c:+document.getElementById(`${t}c${i}`).value||0});
 }
 const m={id:db.nextMatchId++,date,winner:winner==="A"?"Team A":"Team B",teamAName:"Team A",teamBName:"Team B",mvp:document.getElementById("mMvp").value,teams};
 const custom=document.getElementById("mTeamNames").value.split("vs");
 if(custom.length===2){m.teamAName=custom[0].trim()||"Team A";m.teamBName=custom[1].trim()||"Team B"}
 for(const t of ["A","B"]) for(const s of teams[t]){
  const p=playerById(s.id);p.games++;p.kills+=s.k;p.deaths+=s.d;p.obj=(p.obj||0)+s.o;p.carries=(p.carries||0)+s.c;
  p.weeklyGames=(p.weeklyGames||0)+1;p.weeklyKills=(p.weeklyKills||0)+s.k;p.weeklyDeaths=(p.weeklyDeaths||0)+s.d;
  const isWinner=t===winner;
  p.wins=(p.wins||0)+(isWinner?1:0);p.losses=(p.losses||0)+(isWinner?0:1);
  p.weeklyWins=(p.weeklyWins||0)+(isWinner?1:0);
  p.score += Math.round((isWinner?20:5)+s.k*.35-s.d*.15+s.o*2+s.c*1+(m.mvp===p.id?12:0));
  const earned=(isWinner?10:0)+(m.mvp===p.id?5:0)+Math.min(3,s.o);
  p.points=(p.points||0)+earned;p.weeklyPoints=(p.weeklyPoints||0)+earned;
  if(m.mvp===p.id)p.weeklyMvp=(p.weeklyMvp||0)+1;
 }
 db.matches.push(m);save();toast("Match saved and player stats updated");render();
}
function randomizeTeams(){
 const arr=db.players.filter(p=>p.active).sort(()=>Math.random()-.5);
 const a=arr.slice(0,4),b=arr.slice(4,8);
 document.getElementById("randomTeams").innerHTML=`<div class="card"><div class="section-title"><h3>Randomized 4v4</h3><span class="pill">Points Night</span></div><div class="team-choice"><div class="choice selected"><h3>TEAM PURPLE</h3>${a.map(p=>`<p><b>${esc(p.name)}</b> <span class="mini">${esc(p.role)}</span></p>`).join("")}</div><div class="choice selected"><h3>TEAM ROYAL</h3>${b.map(p=>`<p><b>${esc(p.name)}</b> <span class="mini">${esc(p.role)}</span></p>`).join("")}</div></div><p class="mini" style="margin-top:14px">Leaders can reroll before starting the event.</p></div>`;
}
function bindDashboard(){}
function bindMatches(){}
function bindPoints(){}
function bindProfile(){ if(state.viewPlayer){const p=playerById(state.viewPlayer);if(p)document.getElementById("content").innerHTML=profilePage(p,false);state.viewPlayer=null}}
function bindAdmin(){
 document.getElementById("adminForm").innerHTML=`<div class="form-grid"><div><label>Name</label><input id="newName" placeholder="Player name"></div><div><label>4-digit PIN</label><input id="newPin" maxlength="4" inputmode="numeric" placeholder="1234"></div><div><label>Role</label><select id="newRole"><option>FLEX</option><option>SMG</option><option>AR</option><option>OBJ</option><option>ANCHOR</option><option>IGL</option></select></div><div><label>Team</label><input id="newTeam" placeholder="—"></div></div>`;
}
function addPlayer(){
 const name=document.getElementById("newName").value.trim(),pin=document.getElementById("newPin").value.trim();
 if(!name||!/^\d{4}$/.test(pin)){toast("Enter a name and 4-digit PIN.");return}
 if(db.players.some(p=>p.pin===pin)){toast("That PIN is already in use.");return}
 db.players.push({id:name.toLowerCase().replace(/[^a-z0-9]+/g,"-")+"-"+Date.now(),name,role:document.getElementById("newRole").value,team:document.getElementById("newTeam").value||"—",pin,games:0,kills:0,deaths:0,score:0,points:0,weeklyPoints:0,weeklyGames:0,weeklyWins:0,weeklyKills:0,weeklyDeaths:0,weeklyMvp:0,active:true,leader:false});
 save();toast("Member added");render();
}
function editPlayer(id){ if(!isOwner() && !isLeader()){toast("Leaders only");return}
 const p=playerById(id);if(!p)return;
 const name=prompt("Player name:",p.name);if(name!==null&&name.trim())p.name=name.trim();
 const role=prompt("Role:",p.role);if(role!==null&&role.trim())p.role=role.trim().toUpperCase();
 const pin=prompt("4-digit PIN:",p.pin);if(pin!==null&&/^\d{4}$/.test(pin))p.pin=pin;
 const leader=confirm("Make this member a website leader? OK = yes, Cancel = no");
 p.leader=leader;save();toast("Member updated");render();
}
</script>
